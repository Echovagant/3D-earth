name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个分支上新的 push 会取消仍在跑的旧任务，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · test · build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint:check

      - name: 单元测试
        run: npm run test:unit

      - name: 生产构建
        run: npm run build

      # 源讲义在仓库外，CI 机器上没有 _source/ 时 knowledge:check 会打印警告并 exit 0，
      # 所以这里是「有源才检查」；真正的漂移防线在有源讲义的本地机器上（npm run check 会带上）。
      - name: 校验知识数据与源讲义一致
        run: npm run knowledge:check
        continue-on-error: true
