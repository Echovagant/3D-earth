name: Update geo data

# 定时同步 DataV.GeoAtlas 的行政区划边界。
# 只有边界真的变了才会产生提交；行政区划的新增或撤销会被脚本拒绝并让流水线失败，
# 因为那会牵动配色、图例与详情页数据，必须人工确认。

on:
  schedule:
    # 每周一 UTC 03:17 跑一次。定时任务常常延迟几分钟，这是 GitHub 的已知行为。
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个，避免两个任务同时推数据
concurrency:
  group: update-geo
  cancel-in-progress: false

jobs:
  update:
    name: 同步行政区划边界
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取并校验上游边界数据
        run: node scripts/update-geo.mjs --summary-file geo-summary.md

      - name: 拉取并校验世界国界数据
        run: node scripts/update-world.mjs

      - name: 拉取并校验台湾县市边界
        run: node scripts/update-tw.mjs

      # GITHUB_TOKEN 推送的提交不会触发 ci.yml——GitHub 的既定行为。
      # 所以机器人同步进来的第三方几何数据必须在这里自己过一遍门禁，
      # 否则坏数据会绕过全部 lint/测试/构建直达 main。
      - name: 提交前校验
        run: |
          npm ci
          npm run test:unit
          npm run geo:check
          npm run world:check
          npm run tw:check

      - name: 有变化则提交
        run: |
          # 省份详情数据里的「边界围合面积」由边界几何重算而来，跟边界同批更新；
          # 只提交 geojson 会让面积数据与边界永久不一致。
          if [ -z "$(git status --porcelain -- public/geojson public/data/provinces)" ]; then
            echo "地理数据与上游一致，无需提交"
            exit 0
          fi
          {
            echo "chore: 同步行政区划边界数据"
            echo
            echo "由 GitHub Actions 定时任务从 DataV.GeoAtlas 与 Natural Earth 同步。"
            echo
            cat geo-summary.md
          } > commit-msg.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/geojson public/data/provinces
          git commit -F commit-msg.txt
          git push
